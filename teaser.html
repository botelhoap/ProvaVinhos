<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Prova de Vinhos — os resultados serão revelados em breve."
  >
  <title>Prova de Vinhos | Em breve</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .teaserIntro {
      max-width: 760px;
      margin: 0 auto 34px;
      text-align: center;
    }

    .teaserEyebrow {
      margin: 0 0 8px;
      color: var(--wine);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .teaserIntro h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.12;
    }

    .teaserIntro p:last-child {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }

    .teaserSection {
      margin-top: 38px;
    }

    .teaserSectionTitle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0 0 16px;
      color: var(--wine);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 4vw, 30px);
      text-align: center;
    }

    .teaserSectionTitle::before,
    .teaserSectionTitle::after {
      width: min(16vw, 120px);
      height: 1px;
      background: var(--gold);
      content: "";
    }

    .teaserPodium {
      margin-bottom: 0;
    }

    .teaserPodium .podiumCard {
      position: relative;
      min-height: 205px;
      overflow: hidden;
    }

    .teaserPodium .podiumCard::after {
      position: absolute;
      right: -20px;
      bottom: -30px;
      color: rgba(111, 29, 53, 0.06);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 120px;
      font-weight: 700;
      line-height: 1;
      content: "🍷";
      pointer-events: none;
    }

    .teaserPodium .podiumCard > * {
      position: relative;
      z-index: 1;
    }

    .teaserPodium .podiumCard:nth-child(2) {
      border-color: var(--gold);
      box-shadow: 0 8px 22px rgba(176, 138, 62, 0.18);
      transform: translateY(-8px);
    }

    .teaserPodium .podiumName {
      min-height: 50px;
    }

    .teaserScore {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .teaserReveal {
      margin: 38px auto 0;
      padding: 22px;
      border: 1px dashed var(--gold);
      border-radius: 12px;
      background: rgba(255, 253, 248, 0.72);
      text-align: center;
    }

    .teaserReveal strong {
      display: block;
      color: var(--wine);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
    }

    .teaserReveal p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 720px) {
      .teaserIntro {
        margin-bottom: 28px;
      }

      .teaserIntro p:last-child {
        font-size: 14px;
      }

      .teaserSection {
        margin-top: 30px;
      }

      .teaserPodium .podiumCard:nth-child(2) {
        transform: none;
      }

      .teaserPodium .podiumCard {
        min-height: auto;
      }

      .teaserPodium .podiumName {
        min-height: auto;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .teaserPodium .podiumCard {
        animation: teaserEntrada 0.55s ease both;
      }

      .teaserPodium .podiumCard:nth-child(2) {
        animation-delay: 0.12s;
      }

      .teaserPodium .podiumCard:nth-child(3) {
        animation-delay: 0.24s;
      }

      @keyframes teaserEntrada {
        from {
          opacity: 0;
          transform: translateY(12px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .teaserPodium .podiumCard:nth-child(2) {
