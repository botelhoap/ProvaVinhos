<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Classificação da Prova de Vinhos.">
  <title>Prova de Vinhos | Classificação</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="headerInner">
      <h1>Prova de Vinhos</h1>
      <p>Classificação dos vinhos provados</p>
    </div>
  </header>

  <nav aria-label="Navegação principal">
    <div class="navInner">
      <a class="active" href="index.html">Vinhos</a>
      <a href="provadores.html">Provadores</a>
    </div>
  </nav>

  <main>
    <h2 class="sectionTitle">Classificação dos Vinhos</h2>

    <div class="filters" aria-label="Filtrar por tipo de vinho">
      <button class="filter active" type="button" data-filter="todos">Todos</button>
      <button class="filter" type="button" data-filter="branco">Brancos</button>
      <button class="filter" type="button" data-filter="tinto">Tintos</button>
    </div>

    <section id="podio" class="podium" aria-label="Pódio dos vinhos">
      <div class="loading">A carregar classificação...</div>
    </section>

    <section class="tableWrap" aria-label="Tabela de classificação dos vinhos">
      <table>
        <thead>
          <tr>
            <th>Pos.</th>
            <th>Vinho</th>
            <th>Tipo</th>
            <th>Região</th>
            <th>Preço</th>
            <th>Votos</th>
            <th>Pontos</th>
          </tr>
        </thead>
        <tbody id="tabela-vinhos">
          <tr>
            <td colspan="7" class="loading">A carregar dados...</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    <div class="headerInner">
      <p>Resultados atualizados diretamente a partir do Google Sheets.</p>
    </div>
  </footer>

  <script src="dados.js"></script>

  <script>
    let todosOsVinhos = [];
    let filtroAtivo = "todos";

    function medalha(posicao) {
      const medalhas = ["🥇", "🥈", "🥉"];
      return medalhas[posicao] || "🍷";
    }

    function obterVinhosFiltrados() {
      return todosOsVinhos
        .filter((vinho) => {
          if (filtroAtivo === "todos") {
            return true;
          }

          return vinho.tipo.toLowerCase() === filtroAtivo;
        })
        .sort((a, b) => {
          if (b.pontos !== a.pontos) {
            return b.pontos - a.pontos;
          }

          if (b.votos !== a.votos) {
            return b.votos - a.votos;
          }

          return a.nome.localeCompare(b.nome, "pt-PT");
        });
    }

    function renderPodio(vinhos) {
      const podio = document.getElementById("podio");

      if (vinhos.length === 0) {
        podio.innerHTML = `
          <div class="error">
            Não existem vinhos disponíveis para este filtro.
          </div>
        `;
        return;
      }

      podio.innerHTML = vinhos
        .slice(0, 3)
        .map((vinho, indice) => `
          <article class="podiumCard">
            <div class="medal">${medalha(indice)}</div>
            <div class="podiumPosition">${indice + 1}.º lugar</div>
            <h3 class="podiumName">${escapeHtml(vinho.nome)}</h3>
            <div class="score">${formatPoints(vinho.pontos)} pts</div>
            <p class="podiumInfo">
              ${escapeHtml(vinho.tipo)} · ${escapeHtml(vinho.regiao || "Região não indicada")}
            </p>
          </article>
        `)
        .join("");
    }

    function renderTabela(vinhos) {
      const tabela = document.getElementById("tabela-vinhos");

      if (vinhos.length === 0) {
        tabela.innerHTML = `
          <tr>
            <td colspan="7" class="error">
              Não existem vinhos disponíveis para este filtro.
            </td>
          </tr>
        `;
        return;
      }

      tabela.innerHTML = vinhos
        .map((vinho, indice) => `
          <tr>
            <td class="rank">${indice + 1}.º</td>
            <td>
              <strong>${escapeHtml(vinho.nome)}</strong>
              <span class="wineNumber">Vinho n.º ${formatPoints(vinho.numero)}</span>
            </td>
            <td><span class="type">${escapeHtml(vinho.tipo)}</span></td>
            <td>${escapeHtml(vinho.regiao || "—")}</td>
            <td>${escapeHtml(vinho.preco || "—")}</td>
            <td>${formatPoints(vinho.votos)}</td>
            <td class="points">${formatPoints(vinho.pontos)}</td>
          </tr>
        `)
        .join("");
    }

    function atualizarPagina() {
      const vinhos = obterVinhosFiltrados();
      renderPodio(vinhos);
      renderTabela(vinhos);
    }

    async function inicializarClassificacao() {
      try {
        const dados = await getSheetData();

        todosOsVinhos = dados.vinhos;

        if (todosOsVinhos.length === 0) {
          throw new Error("Não foram encontrados vinhos na folha Vencedores.");
        }

        atualizarPagina();
      } catch (erro) {
        console.error(erro);

        document.getElementById("podio").innerHTML = `
          <div class="error">
            Erro ao carregar a classificação: ${escapeHtml(erro.message)}
          </div>
        `;

        document.getElementById("tabela-vinhos").innerHTML = `
          <tr>
            <td colspan="7" class="error">
              Verifica a publicação da Google Sheet e volta a tentar.
            </td>
          </tr>
        `;
      }
    }

    document.querySelectorAll(".filter").forEach((botao) => {
      botao.addEventListener("click", () => {
        document.querySelectorAll(".filter").forEach((item) => {
          item.classList.remove("active");
        });

        botao.classList.add("active");
        filtroAtivo = botao.dataset.filter;
        atualizarPagina();
      });
    });

    window.addEventListener("DOMContentLoaded", inicializarClassificacao);
  </script>
</body>
</html>
